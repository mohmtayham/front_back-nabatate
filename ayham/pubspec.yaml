name: nabtatcompany
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  open_filex: ^4.4.0

  flutter_local_notifications: ^17.2.4  # أحدث إصدار
  timezone: ^0.9.4                     
  provider: ^6.1.1
  shared_preferences: ^2.2.2  
  dio: ^5.3.2
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  path_provider: ^2.1.5
  file_picker: ^10.3.7
  url_launcher: ^6.3.2
  open_file: ^3.5.10
  permission_handler: ^12.0.1
  image_picker: ^1.2.1
  printing: ^5.14.2
  pdf: ^3.11.3
  share_plus: ^12.0.1
  mime_type: ^1.0.1


  # firebase_core: ^4.3.0
  # firebase_messaging: ^16.1.0

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  intl_utils: ^2.8.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

flutter_intl:
  enabled: true
  class_name: S
  main_locale: ar
  arb_dir: lib/l10n
  output_dir: lib/generated
